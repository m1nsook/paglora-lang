name: Validate translation catalogs
on:
  push:
    branches: [main]
    paths: ["locales/**", "scripts/**", "tests/**", "package.json", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["locales/**", "scripts/**", "tests/**", "package.json", ".github/workflows/validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogs:
    name: Locale catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all catalogs
        run: node scripts/validate.mjs
      - name: Test catalog rules
        run: node --test tests/*.test.mjs
